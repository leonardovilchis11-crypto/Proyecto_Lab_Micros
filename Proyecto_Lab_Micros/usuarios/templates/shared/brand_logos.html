{% load static %}
<div class="institutional-logos" aria-label="Logotipos institucionales">
    <img src="{% static 'usuarios/img/logo-ipn.png' %}" alt="Logotipo del IPN" class="institutional-logo-ipn">
    <img src="{% static 'usuarios/img/logo-esime.png' %}" alt="Logotipo de ESIME" class="institutional-logo-esime">
</div>
<style>
    :root {
        --institutional-logo-height: 84px;
    }
    .institutional-logos {
        position: relative;
        width: 100%;
        min-height: var(--institutional-logo-height);
        padding: 6px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff;
        border-bottom: 1px solid #e9ecef;
        pointer-events: none;
    }
    .institutional-logos img {
        display: block;
        width: auto;
        height: auto;
        max-height: 72px;
        max-width: 180px;
        object-fit: contain;
    }
    body.fixed-brand-layout {
        padding-top: calc(var(--institutional-logo-height) + 56px) !important;
    }
    body.fixed-brand-layout > .institutional-logos {
        position: fixed;
        z-index: 1040;
        top: 0;
        left: 0;
    }
    body.fixed-brand-layout > nav.navbar {
        top: var(--institutional-logo-height) !important;
    }
    @media (max-width: 576px) {
        :root {
            --institutional-logo-height: 60px;
        }
        .institutional-logos {
            padding: 4px 12px;
        }
        .institutional-logos img {
            max-height: 48px;
            max-width: 120px;
        }
    }
    @media print {
        .institutional-logos {
            display: none;
        }
    }
</style>
