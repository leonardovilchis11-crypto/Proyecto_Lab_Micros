<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar Contraseña - ESIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        form p {
            margin-bottom: 1rem;
        }
        form p label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.35rem;
        }
        form ul {
            font-size: 0.875rem;
            color: #555;
            padding-left: 1.2rem;
            margin-top: 0.4rem;
        }
        form .helptext {
            display: block;
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.35rem;
        }
        form ul.errorlist {
            color: #dc3545;
            font-weight: 500;
        }
        @media (max-width: 576px) {
            input.form-control, .btn {
                font-size: 16px !important;
                padding: 0.65rem 0.9rem !important;
            }
        }
    </style>
</head>
<body class="bg-light pb-5">
    {% include "shared/brand_logos.html" %}
    <div class="container mt-4 mt-md-5" style="max-width: 460px;">
        <div class="card shadow p-4 border-top border-4" style="border-color: #6a1b29 !important;">
            <h4 class="text-center mb-3" style="color: #6a1b29;">Actualizar Clave de Acceso</h4>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn w-100 text-white mt-2" style="background-color: #6a1b29;">Guardar Nueva Clave</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'mi_cuenta' %}" class="small text-decoration-none">Cancelar y volver</a>
            </div>
        </div>
    </div>
    {% include "shared/session_timeout.html" %}
    <script>
        (function () {
            document.querySelectorAll('input[type="password"]').forEach(function (input) {
                input.classList.add('form-control');
                const wrapper = document.createElement('div');
                wrapper.className = 'input-group';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-secondary';
                btn.setAttribute('aria-label', 'Mostrar u ocultar contraseña');
                btn.setAttribute('title', 'Mostrar u ocultar contraseña');
                btn.innerHTML = '<span>👁️</span>';

                btn.addEventListener('click', function () {
                    const esPassword = input.getAttribute('type') === 'password';
                    input.setAttribute('type', esPassword ? 'text' : 'password');
                    btn.firstElementChild.textContent = esPassword ? '🙈' : '👁️';
                });

                wrapper.appendChild(btn);
            });
        })();
    </script>
</body>
</html>
