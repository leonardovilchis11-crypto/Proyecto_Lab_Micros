<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Laboratorista - ESIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #6a1b29; color: white; }
        .footer-custom { background-color: #333; color: white; }
        form p {
            margin-bottom: 1rem;
        }
        form p label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        form ul {
            font-size: 0.875rem;
            color: #555;
            padding-left: 1.2rem;
            margin-top: 0.4rem;
        }
        form .helptext {
            display: block;
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.35rem;
        }
        form ul.errorlist {
            color: #dc3545;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                font-size: 15px;
            }
            .navbar-custom {
                padding: 0.7rem 1rem !important;
            }
            .navbar-custom .navbar-brand {
                font-size: 1rem !important;
                white-space: normal;
            }
            .card {
                padding: 1.25rem !important;
            }
            form input.form-control,
            form input[type="text"],
            form input[type="email"],
            form input[type="password"],
            form input[type="number"],
            form select.form-select,
            form select,
            .btn {
                font-size: 16px !important;
                padding: 0.65rem 0.9rem !important;
            }
            .form-check-input {
                width: 1.2em;
                height: 1.2em;
            }
            .footer-custom {
                padding: 0.65rem 0.75rem !important;
            }
            .footer-custom small {
                font-size: 0.75rem;
                line-height: 1.25;
                display: block;
            }
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    {% include "shared/brand_logos.html" %}
    <nav class="navbar navbar-custom px-4 py-2">
        <span class="navbar-brand mb-0 h1 text-white">ESIME Culhuacán — Registro de Laboratorista</span>
    </nav>

    <div class="container px-3 mt-4 mt-sm-5 mb-5" style="max-width: 500px;">
        <div class="card shadow p-3 p-sm-4 border-top border-4" style="border-color: #6a1b29 !important;">
            <h3 class="h4 text-center mb-3" style="color: #6a1b29;">Registro de Laboratorista</h3>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn w-100 text-white mt-3" style="background-color: #6a1b29;">
                    Registrarme como Laboratorista
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'seleccionar_registro' %}" class="text-decoration-none text-secondary d-block mb-1">
                    Cambiar tipo de perfil
                </a>
                <a href="{% url 'login' %}" class="text-decoration-none text-muted small">
                    Regresar al Inicio de Sesión
                </a>
            </div>
        </div>
    </div>

    <footer class="footer-custom text-center py-2 mt-auto">
        <small>Instituto Politécnico Nacional — Laboratorio de Microcontroladores</small>
    </footer>
</body>
</html>
