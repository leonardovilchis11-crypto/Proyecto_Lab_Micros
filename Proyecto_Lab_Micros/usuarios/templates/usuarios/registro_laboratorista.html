<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Personal - ESIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #6a1b29; color: white; }
        .footer-custom { background-color: #333; color: white; }
        .btn-admin-custom {
            border: 2px solid #6a1b29;
            color: #6a1b29;
            background-color: #ffffff;
            font-weight: 500;
        }
        .btn-admin-custom:hover {
            background-color: #6a1b29;
            color: #ffffff;
        }
        @media (max-width: 576px) {
            .navbar-brand { font-size: 1rem !important; white-space: normal !important; }
            input.form-control, .btn { font-size: 16px !important; padding: 0.65rem 0.9rem !important; }
        }
    </style>
</head>
<body class="bg-light">
    {% include "shared/brand_logos.html" %}
    <nav class="navbar navbar-custom px-3 px-md-4 py-2">
        <span class="navbar-brand mb-0 h1 text-white">ESIME Culhuacán — Registro de Personal</span>
    </nav>

    <div class="container mt-4 mt-md-5 mb-5" style="max-width: 500px;">
        <div class="card shadow p-4 border-top border-4" style="border-color: #6a1b29 !important;">
            <h3 class="text-center mb-3" style="color: #6a1b29;">Registro de Laboratorista / Administrador</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" name="tipo_registro" value="laboratorista" class="btn w-100 text-white mt-3" style="background-color: #6a1b29;">
                    Registrarme como Laboratorista
                </button>
                <button type="submit" name="tipo_registro" value="administrador" class="btn btn-admin-custom w-100 mt-2">
                    Registrarme como Administrador
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'seleccionar_registro' %}" class="text-decoration-none text-secondary d-block mb-1">
                    Cambiar tipo de perfil
                </a>
                <a href="{% url 'login' %}" class="text-decoration-none text-muted small">
                    Regresar al Inicio de Sesión
                </a>
            </div>
        </div>
    </div>

    <footer class="footer-custom text-center py-2 mt-auto">
        <small>Instituto Politécnico Nacional — Laboratorio de Microcontroladores</small>
    </footer>

    <script>
        (function () {
            document.querySelectorAll('input[type="password"]').forEach(function (input) {
                input.classList.add('form-control');
                const wrapper = document.createElement('div');
                wrapper.className = 'input-group';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-secondary';
                btn.setAttribute('aria-label', 'Mostrar u ocultar contraseña');
                btn.setAttribute('title', 'Mostrar u ocultar contraseña');
                btn.innerHTML = '<span>👁️</span>';

                btn.addEventListener('click', function () {
                    const esPassword = input.getAttribute('type') === 'password';
                    input.setAttribute('type', esPassword ? 'text' : 'password');
                    btn.firstElementChild.textContent = esPassword ? '🙈' : '👁️';
                });

                wrapper.appendChild(btn);
            });
        })();
    </script>
</body>
</html>
