<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Laboratorista - ESIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #6a1b29; color: white; }
        .footer-custom { background-color: #333; color: white; }
    </style>
</head>
<body class="bg-light">
    {% include "shared/brand_logos.html" %}
    <nav class="navbar navbar-custom px-4 py-2">
        <span class="navbar-brand mb-0 h1 text-white">ESIME Culhuacán — Registro de Laboratorista</span>
    </nav>

    <div class="container mt-5 mb-5" style="max-width: 500px;">
        <div class="card shadow p-4 border-top border-4" style="border-color: #6a1b29 !important;">
            <h3 class="text-center mb-3" style="color: #6a1b29;">Registro de Laboratorista</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn w-100 text-white mt-3" style="background-color: #6a1b29;">
                    Registrarme como Laboratorista
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'seleccionar_registro' %}" class="text-decoration-none text-secondary d-block mb-1">
                    Cambiar tipo de perfil
                </a>
                <a href="{% url 'login' %}" class="text-decoration-none text-muted small">
                    Regresar al Inicio de Sesión
                </a>
            </div>
        </div>
    </div>

    <footer class="footer-custom text-center py-2 mt-auto">
        <small>Instituto Politécnico Nacional — Laboratorio de Microcontroladores</small>
    </footer>
</body>
</html>
